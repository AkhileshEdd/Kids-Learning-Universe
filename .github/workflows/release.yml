name: Release

# Builds a signed App Bundle (for Google Play) and APK and attaches them to a
# draft GitHub release. Start it by pushing a tag that matches the version in
# pubspec.yaml (e.g. v1.0.1), or from the Actions tab ("Run workflow").
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      unsigned_prerelease:
        description: 'Only when the signing secrets are not set up: publish the unsigned build as a temporary pre-release so it can be signed by hand'
        type: boolean
        default: false
      cleanup_only:
        description: 'Only delete temporary unsigned pre-releases'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  cleanup:
    if: ${{ inputs.cleanup_only }}
    runs-on: ubuntu-latest
    steps:
      - name: Delete temporary unsigned pre-releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          for tag in $(gh release list --limit 100 --json tagName -q '.[].tagName' | grep '^unsigned-' || true); do
            echo "Deleting $tag"
            gh release delete "$tag" --yes --cleanup-tag
          done

  release:
    if: ${{ !inputs.cleanup_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: Install packages
        run: flutter pub get

      - name: Test
        run: flutter test

      - name: Read version
        id: version
        run: |
          v=$(sed -n 's/^version: *//p' pubspec.yaml)
          echo "name=${v%+*}" >> "$GITHUB_OUTPUT"
          echo "code=${v#*+}" >> "$GITHUB_OUTPUT"
          echo "Releasing version ${v%+*} (versionCode ${v#*+})"

      - name: Check the tag matches pubspec.yaml
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          if [ "${GITHUB_REF_NAME#v}" != "${{ steps.version.outputs.name }}" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version ${{ steps.version.outputs.name }} in pubspec.yaml"
            exit 1
          fi

      - name: Set up release signing
        id: signing
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
          UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$UPLOAD_KEYSTORE_BASE64" ] || [ -z "$UPLOAD_KEYSTORE_PASSWORD" ]; then
            if [ "${{ inputs.unsigned_prerelease }}" != "true" ]; then
              echo "::error::Add the UPLOAD_KEYSTORE_BASE64 and UPLOAD_KEYSTORE_PASSWORD repository secrets (README → Releases)."
              exit 1
            fi
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload-key.jks"
          {
            echo "storeFile=$RUNNER_TEMP/upload-key.jks"
            echo "storePassword=$UPLOAD_KEYSTORE_PASSWORD"
            echo "keyPassword=$UPLOAD_KEYSTORE_PASSWORD"
            echo "keyAlias=upload"
          } > android/key.properties
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Build App Bundle and APK
        run: |
          flutter build appbundle --release
          flutter build apk --release

      - name: Collect files
        id: files
        run: |
          base="kids-learning-universe-${{ steps.version.outputs.name }}-${{ steps.version.outputs.code }}"
          [ "${{ steps.signing.outputs.signed }}" = "true" ] || base="$base-unsigned"
          mkdir dist
          cp build/app/outputs/bundle/release/app-release.aab "dist/$base.aab"
          cp build/app/outputs/flutter-apk/app-release.apk "dist/$base.apk"
          (cd dist && sha256sum * > SHA256SUMS.txt)
          ls -la dist

      - name: Verify the upload key signed the build
        if: steps.signing.outputs.signed == 'true'
        run: |
          apksigner="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner"
          "$apksigner" verify --print-certs dist/*.apk | tee certs.txt
          if grep -q "CN=Android Debug" certs.txt; then
            echo "::error::The APK is signed with a debug key"
            exit 1
          fi
          jarsigner -verify dist/*.aab | tee jar.txt
          grep -q "jar verified" jar.txt

      - name: Create draft release
        if: steps.signing.outputs.signed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v${{ steps.version.outputs.name }}"
          if [ "$(gh release view "$tag" --json isDraft -q .isDraft 2>/dev/null)" = "true" ]; then
            gh release delete "$tag" --yes
          fi
          gh release create "$tag" dist/* --draft --target "$GITHUB_SHA" \
            --title "Kids Learning Universe ${{ steps.version.outputs.name }} (build ${{ steps.version.outputs.code }})" \
            --notes "Signed with the upload key. Upload the .aab to Google Play; the .apk is for installing directly on a test phone."
          # Temporary unsigned builds are no longer needed.
          for old in $(gh release list --limit 100 --json tagName -q '.[].tagName' | grep '^unsigned-' || true); do
            gh release delete "$old" --yes --cleanup-tag
          done

      - name: Publish temporary unsigned pre-release
        if: steps.signing.outputs.signed != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="unsigned-${{ steps.version.outputs.name }}-${{ steps.version.outputs.code }}"
          gh release delete "$tag" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$tag" dist/* --prerelease --target "$GITHUB_SHA" \
            --title "Temporary unsigned build ${{ steps.version.outputs.name }} (${{ steps.version.outputs.code }})" \
            --notes "Temporary: unsigned build to be signed outside CI. Not for Google Play as is. Delete after downloading."

      - name: Clean up signing files
        if: always()
        run: rm -f android/key.properties "$RUNNER_TEMP/upload-key.jks"
